<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Quản Lý</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .status {
            font-size: 24px;
            color: #667eea;
            margin: 20px 0;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>App Quản Lý Đơn Hàng</h1>
        <div class="status">
            <div class="loading"></div>
            Initializing...
        </div>
        <div class="info">
            <p>🚀 App đang được khởi động</p>
            <p>⏳ Vui lòng chờ một chút...</p>
            <p style="margin-top: 30px; color: #999; font-size: 12px;">
                Powered by Flutter & Vercel
            </p>
        </div>
    </div>
    
    <script>
        // Redirect to actual app if available
        window.addEventListener('load', function() {
            // Check if Flutter app is available
            if (typeof flutter !== 'undefined') {
                console.log('Flutter app initialized');
            }
        });
    </script>
</body>
</html>
